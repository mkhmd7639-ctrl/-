<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمل فيديوهات تيك توك الذكي - ميثاق محمد</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #ec4899;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #334155;
            text-align: center;
            box-sizing: border-box;
        }
        h2 { color: #f472b6; margin-top: 0; font-size: 22px; }
        p { color: var(--text-muted); font-size: 13px; margin-bottom: 20px; }
        
        .input-box {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }
        .input-field {
            flex: 1;
            padding: 12px 15px;
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }
        .input-field:focus { border-color: var(--accent); }
        
        .btn {
            background: linear-gradient(135deg, #ec4899, #db2777);
            color: white;
            border: none;
            padding: 0 20px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .btn:hover { opacity: 0.9; }
        
        .paste-last-btn {
            width: 100%;
            background: rgba(16, 185, 129, 0.15);
            border: 1px dashed var(--success);
            color: var(--success);
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .paste-last-btn:hover { background: rgba(16, 185, 129, 0.25); }

        .status-box {
            display: none;
            margin-top: 20px;
            padding: 20px;
            background: #0f172a;
            border-radius: 10px;
            border: 1px solid #334155;
            text-align: center;
        }
        
        .countdown-circle {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
            margin: 10px 0;
        }

        .download-btn {
            display: none;
            width: 100%;
            margin-top: 10px;
            background: var(--success);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            box-sizing: border-box;
            transition: 0.2s;
        }
        .download-btn:hover { background: #059669; }

        .status-msg { font-size: 14px; color: #38bdf8; margin: 0; font-weight: bold; }

        .footer-dev {
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #334155;
        }
        .footer-dev p { color: var(--text-muted); font-size: 13px; margin: 0; }
        .footer-dev a { color: #fbbf24; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
